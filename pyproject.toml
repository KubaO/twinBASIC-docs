[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tbasic-docs-render"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pypdf>=5.0",
]

[project.scripts]
render-book = "docs.render_book:main"

[tool.setuptools.packages.find]
include = ["docs*"]
namespaces = false
